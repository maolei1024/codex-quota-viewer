apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-quota-viewer-osk
  namespace: project-cockpit
  labels:
    app.kubernetes.io/name: codex-quota-viewer
    app.kubernetes.io/instance: osk
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-quota-viewer
      app.kubernetes.io/instance: osk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-quota-viewer
        app.kubernetes.io/instance: osk
    spec:
      nodeSelector:
        kubernetes.io/hostname: oracle-osk
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-state
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - mkdir -p /config/.antigravity_cockpit/codex_quota_viewer_state && chown -R 1000:1000 /config/.antigravity_cockpit/codex_quota_viewer_state
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: codex-quota-viewer
          image: docker.nexus.ixuni.win/codex-quota-viewer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: DATA_DIR
              value: /data
            - name: LISTEN_ADDR
              value: :8080
            - name: STALE_AFTER_MINUTES
              value: "30"
            - name: REFRESH_INTERVAL_SECONDS
              value: "300"
            - name: WEEKLY_RESET_NOTIFY_URL
              value: https://mlntfy.project.k3s.ixuni.win/api/notifications/simple/send/mlNtfy
            - name: WEEKLY_RESET_NOTIFY_STATE_DIR
              value: /state
            - name: WEEKLY_RESET_NOTIFY_TIMEOUT_SECONDS
              value: "10"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /data
              subPath: .antigravity_cockpit
              readOnly: true
            - name: config
              mountPath: /state
              subPath: .antigravity_cockpit/codex_quota_viewer_state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cockpit-tools-config-osk
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
