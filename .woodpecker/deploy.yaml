depends_on:
- build
when:
- event:
  - push
  - manual
  branch: master
steps:
- name: manifest
  image: docker.io/library/python:3.12-alpine
  commands:
  - python3 .ci/image_release.py merge codex/quota-viewer build-${CI_PIPELINE_NUMBER} amd64 arm64 --alias latest
  - python3 .ci/image_release.py pin-files
  environment:
    NEXUS_USERNAME:
      from_secret: nexus_username
    NEXUS_PASSWORD:
      from_secret: nexus_password
- name: deploy
  image: docker.io/library/alpine:3.22
  commands:
  - set -eu
  - apk add --no-cache kubectl
  - mkdir -p ~/.kube
  - echo "$${K8S_KUBECONFIG}" > ~/.kube/config
  - chmod 600 ~/.kube/config
  - kubectl apply -f k8s/service.yaml
  - |
    set -eu
    for instance in osk ash; do
      name="codex-quota-viewer-$instance"
      kubectl apply -f k8s/deployment.yaml -l "app.kubernetes.io/instance=$instance"
      kubectl rollout status deployment/"$name" -n project-cockpit --timeout=10m
    done
  environment:
    K8S_KUBECONFIG:
      from_secret: k8s_kubeconfig
  when:
  - event: [push, manual]
- name: notify-success
  image: docker.nexus.ixuni.win/mlntfy/ci:latest
  pull: true
  when:
  - status:
    - success
  settings:
    url: https://mlntfy.project.k3s.ixuni.win
    topic: mlNtfy
    status: success
    tags: ci,success,deploy
- name: notify-failure
  image: docker.nexus.ixuni.win/mlntfy/ci:latest
  pull: true
  when:
  - status:
    - failure
  settings:
    url: https://mlntfy.project.k3s.ixuni.win
    topic: mlNtfy
    status: failure
    priority: high
    tags: ci,failure,deploy
